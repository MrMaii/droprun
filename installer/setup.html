<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Your DropRun · Setup</title><link rel="stylesheet" href="/setup.css"><script defer src="/setup-ui.js"></script></head>
<body><main><header><a class="wordmark" href="https://github.com/MrMaii/droprun" target="_blank" rel="noreferrer">DropRun<span>↗</span></a><button id="language" class="quiet">中文</button></header>
<section class="intro"><div class="eyebrow" data-en="YOUR DROPRUN / SETUP" data-zh="你的 DROPRUN / 安装设置"></div><h1 data-en="Set up your DropRun." data-zh="连接你的电脑。"></h1><p data-en="Check your computer, connect your own Cloudflare Relay, then pair Android. No DropRun account needed." data-zh="检查电脑，连接你自己的 Cloudflare Relay，再配对 Android 手机。无需 DropRun 账号。"></p><p id="next-step" class="next-step" aria-live="polite"></p></section>
<section class="card"><div class="step">01</div><h2 data-en="Check your computer" data-zh="检查电脑"></h2><p data-en="Codex, Git and a browser are needed. Sign in to Codex before continuing." data-zh="需要 Codex、Git 和浏览器。继续前，请先登录 Codex。"></p><div id="doctor" class="checks" aria-live="polite"></div><p id="doctor-note" class="note" aria-live="polite"></p><details id="project-inventory" hidden><summary data-en="Projects on this computer" data-zh="这台电脑上的项目"></summary><p class="note" data-en="Match the ID shown on your phone to a folder below. This list is read-only; folder paths stay on this computer. Allow phone access in the Android app." data-zh="用手机显示的 ID 核对下面的目录。此列表只读，目录路径仅留在本机。请在安卓 App 中授权项目访问。"></p><p id="project-empty" class="note" data-en="No projects yet. Open a project folder in Codex, then check again." data-zh="还没有项目。请在 Codex 中打开项目目录，再重新检查。"></p><ul id="project-list" tabindex="0" aria-label="Local projects"></ul></details><button id="check" class="quiet" data-en="Check again" data-zh="重新检查"></button><div class="optional-tools"><h3 data-en="Optional source tools" data-zh="可选来源工具"></h3><p class="note" data-en="For extracting supported source media. You can install them later." data-zh="用于提取支持的来源媒体，可稍后安装。"></p><button id="tools" class="quiet" data-en="Install media tools" data-zh="安装媒体工具"></button><p class="note" data-en="Downloads yt-dlp and FFmpeg from their upstream projects, verifies pinned checksums, and keeps their own licenses. No Python installation needed." data-zh="从上游下载 yt-dlp 和 FFmpeg，核对固定校验值，保留各自许可证。无需安装 Python。"></p></div></section>
<section class="card"><div class="step">02</div><h2 data-en="Bring your own cloud" data-zh="连接你自己的云"></h2><p data-en="A browser window will open on Cloudflare. DropRun never receives your Cloudflare password." data-zh="将在浏览器中打开 Cloudflare。DropRun 不会接收你的 Cloudflare 密码。"></p><button id="login" type="button" data-en="Connect Cloudflare" data-zh="连接 Cloudflare"></button>
<div id="relay-summary" class="connection-summary" hidden><p id="relay-status" class="eyebrow"></p><dl><div><dt data-en="Relay" data-zh="Relay 地址"></dt><dd id="relay-address"></dd></div><div id="relay-instance-row" hidden><dt data-en="Instance" data-zh="实例"></dt><dd id="relay-instance"></dd></div></dl><p id="relay-note" class="note"></p></div>
<form id="deployment-form" novalidate><label for="account" data-en="Cloudflare account ID" data-zh="Cloudflare 账号 ID"></label><input id="account" list="accounts" autocomplete="off" autocapitalize="none" spellcheck="false" required pattern="[a-fA-F0-9]{32}" aria-describedby="account-help account-error" placeholder="32-character account ID"><datalist id="accounts"></datalist><p id="account-help" class="field-help" data-en="Choose the account returned after connecting, or paste its 32-character ID." data-zh="连接后选择返回的账号，或粘贴它的 32 位 ID。"></p><p id="account-error" class="field-error" hidden></p>
<label for="name" data-en="Instance name" data-zh="实例名称"></label><input id="name" value="droprun-personal" maxlength="44" minlength="3" autocomplete="off" autocapitalize="none" spellcheck="false" required pattern="[a-z][a-z0-9\-]{2,43}" aria-describedby="name-help name-error"><p id="name-help" class="field-help" data-en="3–44 lowercase letters, numbers or hyphens. Start with a letter." data-zh="3–44 位小写字母、数字或连字符，以字母开头。"></p><p id="name-error" class="field-error" hidden></p>
<p class="note" data-en="Enable R2 in Cloudflare if prompted. Worker, D1, R2 and optional transcription usage belongs to your account; free allowances are not unlimited." data-zh="如有提示，请在 Cloudflare 启用 R2。Worker、D1、R2 和转写使用你的账号额度，免费额度有上限。"></p><a href="https://dash.cloudflare.com/?to=/:account/r2/overview" target="_blank" rel="noreferrer" data-en="Open R2 settings ↗" data-zh="打开 R2 设置 ↗"></a><label class="consent"><input id="cost" type="checkbox" required aria-describedby="cost-error"><span data-en="Create resources in my selected account. I understand that Cloudflare usage may incur charges." data-zh="在所选账号中创建资源。我理解 Cloudflare 用量可能产生费用。"></span></label><p id="cost-error" class="field-error" hidden></p><button id="deploy" type="submit" data-en="Create my Relay" data-zh="创建我的 Relay"></button></form><p class="note" data-en="Interrupted? Keep this window or reopen setup. Completed steps will be reused." data-zh="中途断开？重新打开安装向导即可继续，已完成的步骤不会重复创建资源。"></p></section>
<section class="card"><div class="step">03</div><h2 data-en="Connect your phone" data-zh="连接手机"></h2><p data-en="Start the Connector, then scan its pairing code in the Android app. Each code works once, for ten minutes." data-zh="启动 Connector，在安卓 App 扫描配对码。每个码十分钟有效，只能使用一次。"></p><div class="actions"><button id="start" type="button" data-en="Start Connector" data-zh="启动 Connector"></button><button id="connection-check" type="button" class="quiet" data-en="Check again" data-zh="重新检查"></button><a id="pair-link" class="button quiet" href="http://127.0.0.1:47493/pair" target="_blank" rel="noreferrer" aria-describedby="pair-note" data-en="Open pairing code ↗" data-zh="打开配对码 ↗"></a></div><p id="pair-note" class="note"></p></section>
<section class="status" aria-live="polite"><strong id="step"></strong><p id="error" role="alert"></p><pre id="messages"></pre></section><section class="card"><h2 data-en="Keep things in step" data-zh="保持版本同步"></h2><p data-en="Check release notes before updating. Finish active tasks first; installation keeps your pairing and local data. Cloud resources are never deleted by uninstalling." data-zh="更新前先阅读发布说明，等待进行中的任务结束。安装保留配对和本地数据，卸载不会删除云资源。"></p><button id="updates" class="quiet" data-en="Check releases" data-zh="检查版本"></button><p id="release" aria-live="polite"></p></section><footer data-en="Built for your own tools. Files and reports pass through your Relay. Codex runs locally, using your own account." data-zh="为你自己的工具而造。材料和报告通过你自己的 Relay，Codex 使用你的账号在本地执行。"></footer></main></body></html>
