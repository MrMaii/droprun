plugins { id 'com.android.application' }
android {
    namespace 'app.droprun'
    compileSdk 35
    defaultConfig {
        applicationId 'app.droprun.mobile'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.5.11'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (System.getenv('DROPRUN_KEYSTORE')) {
            release {
                storeFile file(System.getenv('DROPRUN_KEYSTORE'))
                storePassword System.getenv('DROPRUN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DROPRUN_KEY_ALIAS')
                keyPassword System.getenv('DROPRUN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }
        release {
            minifyEnabled false
            if (System.getenv('DROPRUN_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}
dependencies {
    // Pure-Java QR decoding for the pairing scanner; no AndroidX or Play Services needed.
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
