<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" role="img" aria-labelledby="title description" lang="en">
  <title id="title">DropRun: your phone, your cloud, your computer</title>
  <desc id="description">Share a reference and optional note from Android to the Cloudflare Relay you deploy in your own account. Your Windows computer runs the Connector and local Codex in an existing project. Codex login stays on your computer. Submitted material, reports and uploaded artifacts pass through your own Cloudflare; reports or artifacts may include code. Progress, reports and delivery files return through Connector and Relay to your phone.</desc>
  <rect width="400" height="840" rx="24" fill="#171B18"/>
  <g font-family="system-ui, -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <circle cx="30" cy="24" r="5" fill="#B8EF73"/>
    <text x="46" y="31" font-size="20" fill="#B8C0B5">Reference + optional note</text>

    <rect id="phone-card" x="24" y="62" width="352" height="94" rx="20" fill="#232923" stroke="#3B453D" stroke-width="1.5"/>
    <text data-box="phone-card" x="48" y="102" font-size="26" font-weight="600" fill="#F4F6EE">Android phone</text>
    <text data-box="phone-card" x="48" y="132" font-size="20" fill="#B8C0B5">Share a reference + note</text>

    <rect id="relay-card" x="24" y="212" width="352" height="132" rx="20" fill="#232923" stroke="#3B453D" stroke-width="1.5"/>
    <text data-box="relay-card" x="48" y="252" font-size="26" font-weight="600" fill="#F4F6EE">Your Cloudflare Relay</text>
    <text data-box="relay-card" x="48" y="285" font-size="20" fill="#B8C0B5">You deploy it in your account.</text>
    <text data-box="relay-card" x="48" y="317" font-size="20" fill="#B8C0B5">Workers · D1 · R2</text>

    <rect id="computer-group" x="16" y="400" width="368" height="340" rx="24" fill="#283222" stroke="#3B453D" stroke-width="1.5"/>
    <text data-box="computer-group" x="40" y="436" font-size="25" font-weight="600" fill="#F4F6EE">Your Windows computer</text>
    <text data-box="computer-group" x="40" y="465" font-size="20" fill="#B8C0B5">You run both parts locally.</text>

    <rect id="connector-card" x="32" y="490" width="336" height="78" rx="18" fill="#232923" stroke="#3B453D" stroke-width="1.5"/>
    <text data-box="connector-card" x="52" y="522" font-size="24" font-weight="600" fill="#F4F6EE">Windows Connector</text>
    <text data-box="connector-card" x="52" y="548" font-size="20" fill="#B8C0B5">Connects Relay to local Codex</text>

    <rect id="codex-card" x="32" y="618" width="336" height="78" rx="18" fill="#232923" stroke="#3B453D" stroke-width="1.5"/>
    <text data-box="codex-card" x="52" y="650" font-size="24" font-weight="600" fill="#F4F6EE">Local Codex</text>
    <text data-box="codex-card" x="52" y="676" font-size="20" fill="#B8C0B5">Works in your existing project</text>
    <text data-box="computer-group" x="40" y="723" font-size="20" fill="#B8C0B5">Local work + Codex login</text>

    <g fill="none" stroke="#B8C0B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M190 172V198 M184 192L190 198L196 192 M210 198V172 M204 178L210 172L216 178"/>
      <path d="M190 360V386 M184 380L190 386L196 380 M210 386V360 M204 366L210 360L216 366"/>
      <path d="M190 584V604 M184 598L190 604L196 598 M210 604V584 M204 590L210 584L216 590"/>
    </g>
    <text x="24" y="784" font-size="20" fill="#B8C0B5">Progress, reports + files return</text>
    <text x="24" y="812" font-size="20" fill="#B8C0B5">through Relay to your phone.</text>
  </g>
</svg>
