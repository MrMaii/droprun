<svg xmlns="http://www.w3.org/2000/svg" width="400" height="840" viewBox="0 0 400 840" role="img" aria-labelledby="title description" lang="zh">
  <title id="title">DropRun：你的手机、云与电脑</title>
  <desc id="description">从 Android 分享参考材料和可选留言，经你部署在自己 Cloudflare 账号中的 Relay，进入你 Windows 电脑上运行的 Connector 和本地 Codex。Codex 在已有项目中工作，项目代码与 Codex 登录留在电脑。进度、报告和交付文件经 Connector 与 Relay 返回手机。</desc>
  <rect width="400" height="840" rx="24" fill="#F7F7F2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <circle cx="30" cy="24" r="5" fill="#B8EF73"/>
    <text x="46" y="31" font-size="20" fill="#616A63">参考材料 + 可选留言</text>

    <rect id="phone-card" x="24" y="62" width="352" height="94" rx="20" fill="#FFFFFF" stroke="#E1E5DD" stroke-width="1.5"/>
    <text data-box="phone-card" x="48" y="102" font-size="26" font-weight="600" fill="#191D1A">Android 手机</text>
    <text data-box="phone-card" x="48" y="132" font-size="20" fill="#616A63">分享参考材料与留言</text>

    <rect id="relay-card" x="24" y="212" width="352" height="132" rx="20" fill="#FFFFFF" stroke="#E1E5DD" stroke-width="1.5"/>
    <text data-box="relay-card" x="48" y="252" font-size="26" font-weight="600" fill="#191D1A">Cloudflare Relay</text>
    <text data-box="relay-card" x="48" y="285" font-size="20" fill="#616A63">由你部署到自己的账号</text>
    <text data-box="relay-card" x="48" y="317" font-size="20" fill="#616A63">Workers · D1 · R2</text>

    <rect id="computer-group" x="16" y="400" width="368" height="340" rx="24" fill="#EFF4E8" stroke="#DDE5D4" stroke-width="1.5"/>
    <text data-box="computer-group" x="40" y="436" font-size="25" font-weight="600" fill="#191D1A">自己的 Windows 电脑</text>
    <text data-box="computer-group" x="40" y="465" font-size="20" fill="#616A63">由你在本机安装并运行</text>

    <rect id="connector-card" x="32" y="490" width="336" height="78" rx="18" fill="#FFFFFF" stroke="#E1E5DD" stroke-width="1.5"/>
    <text data-box="connector-card" x="52" y="522" font-size="24" font-weight="600" fill="#191D1A">Windows Connector</text>
    <text data-box="connector-card" x="52" y="548" font-size="20" fill="#616A63">连接 Relay 与本地 Codex</text>

    <rect id="codex-card" x="32" y="618" width="336" height="78" rx="18" fill="#FFFFFF" stroke="#E1E5DD" stroke-width="1.5"/>
    <text data-box="codex-card" x="52" y="650" font-size="24" font-weight="600" fill="#191D1A">本地 Codex</text>
    <text data-box="codex-card" x="52" y="676" font-size="20" fill="#616A63">在你的已有项目中工作</text>
    <text data-box="computer-group" x="40" y="723" font-size="20" fill="#616A63">项目代码与 Codex 登录留在这里</text>

    <g fill="none" stroke="#616A63" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M190 172V198 M184 192L190 198L196 192 M210 198V172 M204 178L210 172L216 178"/>
      <path d="M190 360V386 M184 380L190 386L196 380 M210 386V360 M204 366L210 360L216 366"/>
      <path d="M190 584V604 M184 598L190 604L196 598 M210 604V584 M204 590L210 584L216 590"/>
    </g>
    <text x="24" y="784" font-size="20" fill="#616A63">进度、报告与产物</text>
    <text x="24" y="812" font-size="20" fill="#616A63">经 Relay 返回你的手机。</text>
  </g>
</svg>
