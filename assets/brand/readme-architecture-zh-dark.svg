    <g fill="#F4F6EE" font-size="23" font-weight="600" text-anchor="middle">
      <text x="118" y="159">Android</text>
      <text x="376" y="154">自己的 Cloudflare</text>
      <text x="376" y="182">Relay</text>
      <text x="638" y="154">Windows</text>
      <text x="638" y="182">Connector</text>
      <text x="884" y="159">本地 Codex</text>
    </g>
    <g fill="#B8C0B5" font-size="16" text-anchor="middle">
      <text x="118" y="192">分享浮层</text>
      <text x="376" y="214">Workers · D1 · R2</text>
