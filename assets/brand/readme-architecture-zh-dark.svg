<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title description">
  <title id="title">DropRun 自部署架构</title>
  <desc id="description">参考材料和留言从 Android 经自己的 Cloudflare Relay、Windows Connector 到本地 Codex。进度、报告和文件经 Connector、Relay 返回手机。项目代码和 Codex 登录留在电脑。</desc>
  <rect width="1000" height="320" rx="24" fill="#171B18"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
