    <rect x="526" y="58" width="464" height="206" rx="20" fill="#283222" stroke="#3B453D"/>
    <text x="548" y="87" font-size="16" font-weight="600" fill="#B8C0B5">自己的电脑 · 项目代码与 Codex 登录留在这里</text>
    <g fill="#232923" stroke="#3B453D" stroke-width="1.5">
      <rect x="28" y="112" width="180" height="130" rx="18"/>
      <rect x="272" y="112" width="208" height="130" rx="18"/>
      <rect x="544" y="112" width="188" height="130" rx="18"/>
      <rect x="796" y="112" width="176" height="130" rx="18"/>
