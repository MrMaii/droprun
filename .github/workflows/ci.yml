name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  DROPRUN_CI_BROWSER_TESTS: >-
    tests/browser.test.mjs tests/relay-selfhost-browser.test.mjs
    tests/setup-actions.test.mjs tests/setup-ui.test.mjs
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install media test tools
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - name: Test core without concurrent browser processes
        shell: pwsh
        run: |
          $browserTests = $env:DROPRUN_CI_BROWSER_TESTS -split '\s+'
          $allTests = @(Get-ChildItem -LiteralPath tests -Filter '*.test.mjs' | ForEach-Object { "tests/$($_.Name)" })
          if (@($browserTests | Where-Object { $_ -notin $allTests }).Count) { throw 'A configured browser test file is missing.' }
          $coreTests = @($allTests | Where-Object { $_ -notin $browserTests })
          if ($coreTests.Count + $browserTests.Count -ne $allTests.Count) { throw 'Every test file must belong to exactly one job.' }
          Write-Host "Core: $($coreTests.Count) files; browser: $($browserTests.Count) files; total: $($allTests.Count) files."
          node --test --test-concurrency=4 @coreTests
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - run: npm audit --audit-level=high
      - run: npm run site:build
        env:
          DROPRUN_SITE_URL: https://droprun.dengmaizi0802.chatgpt.site
      - name: Verify generated pages and refresh Windows line-ending metadata
        shell: pwsh
        run: |
          git diff --exit-code -- landing/index.html landing/zh/index.html landing/robots.txt landing/sitemap.xml
          if ($LASTEXITCODE -ne 0) { throw 'Generated site differs from committed source.' }
          git add -- landing/index.html landing/zh/index.html landing/robots.txt landing/sitemap.xml
          git diff --cached --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Generated site changed the source index.' }
      - run: npm run check:public
      - name: Install package compiler
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer and portable package
        shell: pwsh
        run: |
          $compiler = Get-ChildItem 'C:/Program Files*/Inno Setup*/ISCC.exe' | Select-Object -First 1
          if (-not $compiler) { throw 'Inno Setup compiler is unavailable.' }
          node scripts/package-windows.mjs --output .local/releases/ci --iscc $compiler.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-verification
          path: |
            .local/releases/ci/*.exe
            .local/releases/ci/*.zip
            .local/releases/ci/*.sha256
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Record selected browser and runner resources
        shell: pwsh
        run: |
          $browserPath = node --input-type=module -e "import { findBrowser } from './connector/browser.mjs'; const path = findBrowser(); if (!path) process.exit(1); console.log(path);"
          if ($LASTEXITCODE -ne 0) { throw 'A real browser is required for CI.' }
          $browserFile = Get-Item -LiteralPath $browserPath
          Write-Host "Browser: $browserPath ($($browserFile.VersionInfo.ProductVersion))"
          $cores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          $memory = Get-CimInstance Win32_OperatingSystem
          Write-Host "Runner: $cores logical cores; $([math]::Round($memory.TotalVisibleMemorySize / 1024)) MB total / $([math]::Round($memory.FreePhysicalMemory / 1024)) MB free."
      - name: Test real browsers in isolation
        shell: pwsh
        run: |
          $browserTests = $env:DROPRUN_CI_BROWSER_TESTS -split '\s+'
          node --test --test-concurrency=1 @browserTests
          if ($LASTEXITCODE -ne 0) { throw 'Browser tests failed.' }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
        working-directory: android
